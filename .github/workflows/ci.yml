name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  windows-core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test windows/tests/Awake.Core.Tests.csproj -c Release
      - run: dotnet run --project windows/service-tests/Awake.Service.Tests.csproj -c Release
  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ARCHITECTURES='arm64 x86_64' CONFIGURATION=release ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: keepmymacawake-universal-unsigned-preview
          path: dist/KeepMyMacAwake.app
          retention-days: 7
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build windows/KeepMyMacAwake.slnx -c Release
      - run: dotnet test windows/tests/Awake.Core.Tests.csproj -c Release --no-build
      - run: dotnet run --project windows/service-tests/Awake.Service.Tests.csproj -c Release --no-build
      - run: dotnet run --project windows/app-tests/Awake.App.Tests.csproj -c Release --no-build
      - shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: keepmymacawake-windows-x64-unsigned-preview
          path: |
            dist/windows/win-x64/*.zip
            dist/windows/win-x64/SHA256SUMS.txt
          retention-days: 7
