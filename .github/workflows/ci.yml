name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: 'Build Windows previews, or run all platform checks'
        type: choice
        options:
          - windows
          - all
        default: windows
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  windows-core-linux:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test windows/tests/Awake.Core.Tests.csproj -c Release
      - run: dotnet run --project windows/service-tests/Awake.Service.Tests.csproj -c Release
  macos-build:
    if: github.event_name != 'workflow_dispatch' || inputs.scope == 'all'
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ARCHITECTURES='arm64 x86_64' CONFIGURATION=release ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: keepmymacawake-universal-unsigned-preview
          path: dist/KeepMyMacAwake.app
          retention-days: 7
  windows-build:
    name: Windows ${{ matrix.runtime }} tests, installer and UI report
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: win-x64
            runner: windows-2025
          - runtime: win-arm64
            runner: windows-11-arm
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      AWAKE_RUNTIME: ${{ matrix.runtime }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.401'
      - name: Build native Windows projects
        run: dotnet build windows/KeepMyMacAwake.slnx -c Release
      - name: Core tests with TRX report
        run: dotnet test windows/tests/Awake.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=core.trx" --results-directory "dist/windows/${{ matrix.runtime }}/report/tests"
      - name: Protocol and backend simulation checks
        run: dotnet run --project windows/service-tests/Awake.Service.Tests.csproj -c Release --no-build
      - name: WPF checks and 126 interface previews
        run: dotnet run --project windows/app-tests/Awake.App.Tests.csproj -c Release --no-build -- --report-dir "dist/windows/${{ matrix.runtime }}/report/ui"
      - name: Publish self-contained ZIP
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Runtime $env:AWAKE_RUNTIME
      - name: Install NSIS compiler
        shell: pwsh
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'NSIS/makensis.exe'
          choco upgrade nsis --version=3.13.0 --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
          if (-not (Test-Path $compiler)) { throw 'NSIS compiler not found' }
          "AWAKE_MAKENSIS=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build current-user EXE installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Runtime $env:AWAKE_RUNTIME
      - name: Verify packages and record build provenance
        shell: pwsh
        run: ./scripts/verify-windows-package.ps1 -Runtime $env:AWAKE_RUNTIME
      - name: Installer lifecycle smoke test on disposable CI host
        shell: pwsh
        run: ./scripts/test-windows-installer.ps1 -Runtime $env:AWAKE_RUNTIME
      - name: Upload installation packages
        uses: actions/upload-artifact@v7
        with:
          name: keepmymacawake-${{ matrix.runtime }}-unsigned-preview
          path: |
            dist/windows/${{ matrix.runtime }}/*.zip
            dist/windows/${{ matrix.runtime }}/*setup-preview.exe
            dist/windows/${{ matrix.runtime }}/SHA256SUMS.txt
            dist/windows/${{ matrix.runtime }}/build-info.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
      - name: Upload test report and WPF images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: keepmymacawake-${{ matrix.runtime }}-ui-and-test-report
          path: dist/windows/${{ matrix.runtime }}/report/
          if-no-files-found: warn
          retention-days: 14
      - name: Write download and validation summary
        if: always()
        shell: pwsh
        run: |
          $lines = @(
            '## KeepMyMacAwake Windows preview',
            "Runtime: $env:AWAKE_RUNTIME",
            "Source: $env:GITHUB_SHA",
            '',
            'Download the unsigned-preview artifact for EXE, ZIP, SHA256SUMS and build-info.json.',
            'Download ui-and-test-report, extract it and open ui/index.html on your Mac.',
            '',
            'WPF images render actual application controls with synthetic telemetry at 100%, 125% and 200%.',
            'Silent install, upgrade, packaged updater and uninstall are checked on this disposable CI host.',
            'High-contrast images preview application resources; the OS setting is unchanged.',
            'This CI does not establish ordinary-user installation, real notifications, power/lock/lid behavior or signed distribution.'
          )
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
