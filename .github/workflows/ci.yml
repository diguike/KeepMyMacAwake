name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.0.3
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./scripts/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: keepmymacawake-unsigned-preview
          path: dist/KeepMyMacAwake.app
          retention-days: 7
